<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Queue Pass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0b1329;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
            --subtle: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }
        .header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .token {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            margin: 6px 0;
        }
        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .waiting { background: #0369a1; color: #e0f2fe; }
        .called { background: var(--success); color: #022c22; animation: pulse 1.2s infinite; }
        .preempt-banner {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--danger);
            color: #fee2e2;
            padding: 14px;
            border-radius: 10px;
            margin: 16px 0;
            font-size: 0.92rem;
            text-align: center;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .box {
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .box-label { font-size: 0.72rem; color: var(--subtle); text-transform: uppercase; }
        .box-value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
        .qr-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 18px;
            padding: 14px;
            background: #ffffff;
            border-radius: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 0.8rem; color: var(--subtle); letter-spacing: 1px;">PATIENT QUEUE PASS</div>
            <div class="token" id="tokenLabel">---</div>
            <span class="badge waiting" id="statusBadge">CONNECTING...</span>
        </div>

        <div class="preempt-banner" id="preemptBanner"></div>

        <div class="grid">
            <div class="box">
                <div class="box-label">Doctor's Line Pos</div>
                <div class="box-value" id="posVal">--</div>
            </div>
            <div class="box">
                <div class="box-label">Est. Wait Time</div>
                <div class="box-value" id="waitVal">--</div>
            </div>
            <div class="box">
                <div class="box-label">Assigned Doctor</div>
                <div class="box-value" style="font-size: 1.05rem;" id="docVal">--</div>
            </div>
            <div class="box">
                <div class="box-label">Consultation Room</div>
                <div class="box-value" style="color: var(--accent);" id="roomVal">--</div>
            </div>
        </div>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>
        <p style="text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 12px;">
            Mirror this pass on your personal mobile device
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const myToken = urlParams.get('token') || "TK-101";
        document.getElementById('tokenLabel').innerText = myToken;

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 120,
            height: 120
        });

        document.body.addEventListener('click', () => {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }, { once: true });

        function playAlertTone() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.setValueAtTime(900, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        function triggerAlert(title, message) {
            playAlertTone();

            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    new Notification(title, { body: message });
                } catch (e) {}
            }

            const banner = document.getElementById('preemptBanner');
            banner.style.display = 'block';
            banner.innerHTML = `🚨 <strong>${title}</strong><br>${message}`;
        }

        let lastPosition = null;

        async function pollQueue() {
            try {
                const res = await fetch('/live_queue.json?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();

                if (data.last_called && data.last_called.token === myToken) {
                    document.getElementById('preemptBanner').style.display = 'none';
                    document.getElementById('statusBadge').className = 'badge called';
                    document.getElementById('statusBadge').innerText = 'PROCEED TO ROOM NOW';
                    document.getElementById('posVal').innerText = 'NOW';
                    document.getElementById('waitVal').innerText = '0 mins';
                    document.getElementById('docVal').innerText = data.last_called.doctor;
                    document.getElementById('roomVal').innerText = data.last_called.room;

                    triggerAlert("🚨 YOUR TURN NOW!", `Proceed immediately to ${data.last_called.room} (${data.last_called.doctor})`);
                    return;
                }

                const myPatient = data.queue.find(p => p.token === myToken);
                if (myPatient) {
                    const doctorQueue = data.queue.filter(p => p.doctor === myPatient.doctor);
                    const positionInDocLine = doctorQueue.findIndex(p => p.token === myToken) + 1;
                    const estWaitMins = positionInDocLine * 10;

                    document.getElementById('statusBadge').className = 'badge waiting';
                    document.getElementById('statusBadge').innerText = 'WAITING IN QUEUE';
                    document.getElementById('posVal').innerText = '#' + positionInDocLine;
                    document.getElementById('waitVal').innerText = estWaitMins + ' mins';
                    document.getElementById('docVal').innerText = myPatient.doctor;
                    document.getElementById('roomVal').innerText = myPatient.room;

                    if (lastPosition !== null && positionInDocLine > lastPosition) {
                        const shift = positionInDocLine - lastPosition;
                        triggerAlert(
                            "Wait Time Extended",
                            `Emergency admission to ${myPatient.doctor}. You were pushed back ${shift} slot(s) to #${positionInDocLine} (~${estWaitMins}m wait).`
                        );
                    }

                    lastPosition = positionInDocLine;
                }
            } catch (err) {}
        }

        setInterval(pollQueue, 2000);
        pollQueue();
    </script>
</body>
</html>
